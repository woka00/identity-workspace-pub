name: Desktop installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-latest
            platform: mac
            arch: x64
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run dist:${{ matrix.platform }} -- --${{ matrix.arch }}
      - uses: actions/upload-artifact@v6
        with:
          name: identity-workspace-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            desktop/dist/*.deb
            desktop/dist/*.AppImage
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
