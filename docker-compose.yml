services:
  db:
    image: postgres:16.14-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-identity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-identity-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-identity_workspace}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - database

  app:
    build:
      context: .
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgres://identity:identity-local-only@db:5432/identity_workspace?sslmode=disable}
      PLAYER_TZ: ${PLAYER_TZ:-Europe/Moscow}
      ADDR: :8080
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}
      FATSECRET_CONSUMER_KEY: ${FATSECRET_CONSUMER_KEY:-}
      FATSECRET_CONSUMER_SECRET: ${FATSECRET_CONSUMER_SECRET:-}
      FATSECRET_CALLBACK_URL: ${FATSECRET_CALLBACK_URL:-http://localhost:8080/api/integrations/fatsecret/callback}
      TICKTICK_CLIENT_ID: ${TICKTICK_CLIENT_ID:-}
      TICKTICK_CLIENT_SECRET: ${TICKTICK_CLIENT_SECRET:-}
      TICKTICK_CALLBACK_URL: ${TICKTICK_CALLBACK_URL:-http://localhost:8080/api/integrations/ticktick/callback}
      STATIC_DIR: /app/static
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - database
      - outbound

volumes:
  pgdata:

networks:
  database:
    internal: true
  outbound:
