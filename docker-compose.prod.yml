# Production overlay. Create all referenced files under ./secrets with mode 600.
# Never commit that directory.
services:
  db:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-avatar}
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: avatarid
    secrets:
      - postgres_password

  app:
    environment:
      APP_ENV: production
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/database_url
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL, e.g. https://avatar.example.com}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      TRUST_PROXY: "true"
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      DATA_ENCRYPTION_KEY: ""
      DATA_ENCRYPTION_KEY_FILE: /run/secrets/data_encryption_key
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      FATSECRET_CONSUMER_KEY: ""
      FATSECRET_CONSUMER_KEY_FILE: /run/secrets/fatsecret_consumer_key
      FATSECRET_CONSUMER_SECRET: ""
      FATSECRET_CONSUMER_SECRET_FILE: /run/secrets/fatsecret_consumer_secret
      FATSECRET_CALLBACK_URL: ${FATSECRET_CALLBACK_URL:-}
      OPENFOODFACTS_USER_AGENT: ${OPENFOODFACTS_USER_AGENT:-identity-workspace/1.0 (admin@localhost)}
    secrets:
      - database_url
      - data_encryption_key
      - fatsecret_consumer_key
      - fatsecret_consumer_secret

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
  data_encryption_key:
    file: ./secrets/data_encryption_key
  fatsecret_consumer_key:
    file: ./secrets/fatsecret_consumer_key
  fatsecret_consumer_secret:
    file: ./secrets/fatsecret_consumer_secret
